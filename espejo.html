<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090714">
  <title>El espejo mágico ✦</title>
  <link rel="stylesheet" href="css/mirror.css">
</head>
<body class="mirror-page">
  <div class="magic-sky" aria-hidden="true">
    <span class="mist mist--one"></span>
    <span class="mist mist--two"></span>
    <span class="star star--1"></span><span class="star star--2"></span>
    <span class="star star--3"></span><span class="star star--4"></span>
    <span class="star star--5"></span><span class="star star--6"></span>
    <span class="spark spark--1"></span><span class="spark spark--2"></span>
    <span class="spark spark--3"></span><span class="spark spark--4"></span>
    <span class="spark spark--5"></span><span class="spark spark--6"></span>
  </div>

  <main class="mirror-stage">
    <header class="story-heading">
      <span class="story-kicker">una última página del cuento</span>
      <h1>El espejo mágico</h1>
      <p>Donde una historia puede volver a cobrar vida.</p>
    </header>

    <section class="mirror-wrap" aria-label="Espejo mágico con video">
      <div class="mirror-crown" aria-hidden="true">✦</div>
      <div class="mirror-frame">
        <div class="mirror-inner">
          <div class="glass-glow" aria-hidden="true"></div>
          <video
            id="storyVideo"
            class="mirror-video"
            src="video/bist.mp4"
            preload="metadata"
            autoplay
            muted
            playsinline
            controls
            aria-label="Video del caballero y la princesa">
            Tu navegador no puede reproducir este video.
          </video>
          <div class="mirror-reflection" aria-hidden="true"></div>
        </div>
      </div>
      <div class="mirror-ornament mirror-ornament--left" aria-hidden="true">❦</div>
      <div class="mirror-ornament mirror-ornament--right" aria-hidden="true">❦</div>
    </section>

    <p class="video-note">Caballero y princesa · una escena para guardar entre las páginas.</p>

    <nav class="mirror-actions" aria-label="Navegación">
      <a class="story-button" href="index.html">
        <span aria-hidden="true">←</span>
        <span>volver al inicio</span>
      </a>
      <a class="story-button story-button--primary" href="siguiente.html">
        <span>regresar al cuento</span>
        <span aria-hidden="true">✦</span>
      </a>
    </nav>
  </main>

  <script>
    const video = document.getElementById('storyVideo');

    // Autoplay silencioso: mantiene la reproducción automática compatible con móviles.
    // El control nativo del video permite activar el audio manualmente cuando el navegador lo permita.
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(() => {
        // Algunos navegadores móviles requieren una interacción del usuario.
      });
    });
  </script>
</body>
</html>
